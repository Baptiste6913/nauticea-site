# Suivi des versions des actions GitHub (durcissement du 17/08).
# Les actions sont épinglées sur des condensats de commit dans les
# workflows : Dependabot ouvre une PR hebdomadaire quand une nouvelle
# version paraît, en mettant à jour le condensat et le commentaire de tag.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Actions"
    labels:
      - "dependances"

  # Dépendances npm : un seul PR hebdomadaire regroupe les montées
  # mineures et correctives, tandis qu'une montée majeure (rupture
  # possible) obtient son propre PR, puisqu'elle ne correspond à aucun
  # groupe déclaré.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Dépendances"
    labels:
      - "dependances"
    groups:
      npm-mineures-et-correctives:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
