# Phase B (livré désactivé) : synchronisation du flux XML Boats Group.
#
# Le workflow ne fait rien tant que le secret FEED_URL n'est pas défini
# dans les réglages du dépôt (Settings > Secrets and variables > Actions).
# Une fois FEED_URL renseigné (URL du flux Open Marine fourni par
# Boats Group), chaque exécution télécharge le flux, le normalise en JSON
# et committe le résultat si le contenu a changé.
#
# Actions épinglées sur un condensat de commit complet, avec le tag en
# commentaire : une étiquette comme v4 est mobile et peut être déplacée
# par son mainteneur, un condensat ne l'est pas. Dependabot
# (.github/dependabot.yml) propose les montées de version par PR.
name: Synchronisation flux Boats Group

on:
  schedule:
    # Deux fois par jour : 05h00 et 17h00 UTC.
    - cron: "0 5 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Vérifier la présence du secret FEED_URL
        id: garde
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
        run: |
          if [ -z "$FEED_URL" ]; then
            echo "actif=false" >> "$GITHUB_OUTPUT"
            echo "FEED_URL absent : synchronisation désactivée."
          else
            echo "actif=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.garde.outputs.actif == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        if: steps.garde.outputs.actif == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Télécharger et normaliser le flux
        if: steps.garde.outputs.actif == 'true'
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          # Liste blanche des hôtes d'images du flux, à renseigner d'après
          # le premier flux réel (le rapport de synchronisation affiche les
          # hôtes rencontrés). Absente : toutes les images sont refusées.
          FEED_IMAGE_HOSTS: ${{ vars.FEED_IMAGE_HOSTS }}
        run: |
          # Téléchargement borné en durée et en taille : un flux hostile ou
          # une URL qui ne répond pas ne doit ni bloquer ni remplir le disque.
          curl -sSf --max-time 120 --max-filesize 50000000 "$FEED_URL" -o /tmp/feed.xml
          node --experimental-strip-types scripts/normalise-feed.mts /tmp/feed.xml corpus-nauticea/bateaux-boatsgroup.json

      - name: Committer si diff
        if: steps.garde.outputs.actif == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add corpus-nauticea/bateaux-boatsgroup.json corpus-nauticea/rapport-sync-flux.json public/annonces
          if git diff --cached --quiet; then
            echo "Aucun changement dans le flux."
          else
            git commit -m "Synchronisation du flux Boats Group"
            git push
          fi
